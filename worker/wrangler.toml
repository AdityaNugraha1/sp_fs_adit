name = "spfs-be"
main = "src/index.js"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.spfs.keviinnn.my.id", custom_domain = true }
]

# Secrets are set via `wrangler secret put <NAME>`, NOT stored here:
#   JWT_SECRET      - signing key for auth tokens
#   DATABASE_URL    - Neon Postgres connection string
# [vars] is intentionally empty so nothing sensitive lands in git.
